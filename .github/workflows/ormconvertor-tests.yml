name: ORMConvertor tests

on:
  push:
    branches: [main]
    paths:
      - "ORMConvertor/**" # run only when something inside the solution changed
      - ".github/workflows/**" # ... and when this file changes, so a broken edit shows up here
  pull_request:
    # No pull request is ever opened here - development is solo and on `main` (see
    # ORMConvertor/README.md) - so this trigger is for a future in which one is.
    paths:
      - "ORMConvertor/**"
      - ".github/workflows/**"
  schedule:
    # An advisory against a pinned package appears without anyone pushing, so the
    # dependency check needs a clock of its own (decision 069). Only that job runs then.
    - cron: "0 6 * * 1"

# Neither job writes anything back, so neither needs more than read access to the code.
permissions:
  contents: read

jobs:
  test:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest

    defaults: # all subsequent `run:` steps execute from ORMConvertor/
      run:
        working-directory: ORMConvertor

    services:
      # The same SQL Server version the container configuration uses, so that what this
      # workflow proves and what `docker compose --profile test run --rm tests`
      # reproduces are one claim (decision 039). The password is a development credential
      # of a throwaway instance that lives only inside this job - S4 bans credentials in
      # generated artifacts and in logs, not in the description of an environment.
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: Testingorms123
          MSSQL_PID: Developer
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P Testingorms123 -C -Q 'SELECT 1'"
          --health-interval 5s
          --health-timeout 10s
          --health-retries 30
          --health-start-period 15s

    steps:
      - uses: actions/checkout@v5

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      # The fixture creates a schema, not a database (decision 016), so the database is
      # the environment's job here exactly as it is in docker-compose.yml.
      - name: Create the test database
        run: >-
          docker exec ${{ job.services.sqlserver.id }}
          /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P Testingorms123 -C
          -Q "IF DB_ID('ORMConvertorTests') IS NULL CREATE DATABASE ORMConvertorTests;"

      - name: Restore
        run: dotnet restore ORMConvertor.sln

      - name: Build
        run: dotnet build ORMConvertor.sln --configuration Release --no-restore

      - name: Test (xUnit v3)
        env:
          ConnectionStrings__TestDatabase: Server=localhost,1433;Database=ORMConvertorTests;User ID=sa;Password=Testingorms123;TrustServerCertificate=True;
          # This job started a database, so a database-dependent test that skipped would
          # be a false green - here a missing database fails (decision 039).
          ORMCONVERTOR_REQUIRE_TEST_DATABASE: "1"
        # Coverage is collected, not gated: no threshold decides the build. It answers
        # "how much of the code do the tests reach", which until now was read off the
        # source rather than measured, and T3 reports numbers of the same family.
        run: >-
          dotnet test Tests/Tests.csproj --configuration Release --no-build
          --logger "trx;LogFileName=test_results.trx"
          --collect:"XPlat Code Coverage"

      - name: Upload test results and coverage
        if: always() # the coverage of a failed run is the interesting one
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ORMConvertor/Tests/TestResults/
          if-no-files-found: warn

  # The Java suite (decisions 076 and 078): the same database, a JVM on the runner rather
  # than in an image, and an instance of the application published and started here -
  # that is where the suite takes the generated artifacts from. This is the division of
  # decision 039 - the workflow proves that the suite passes against SQL Server of the
  # stated version and against the tool of this checkout, the compose profile that the same
  # works where nothing is installed; compose here would rebuild the image without its
  # layer cache.
  java-test:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest

    defaults: # all subsequent `run:` steps execute from ORMConvertor/JavaTests/
      run:
        working-directory: ORMConvertor/JavaTests

    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: Testingorms123
          MSSQL_PID: Developer
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P Testingorms123 -C -Q 'SELECT 1'"
          --health-interval 5s
          --health-timeout 10s
          --health-retries 30
          --health-start-period 15s

    steps:
      - uses: actions/checkout@v5

      # Temurin 25 is the JDK of the pinned image maven:3.9.11-eclipse-temurin-25-noble;
      # Maven itself is preinstalled on the runner.
      - name: Install JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: ORMConvertor/JavaTests/pom.xml

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Create the test database
        run: >-
          docker exec ${{ job.services.sqlserver.id }}
          /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P Testingorms123 -C
          -Q "IF DB_ID('ORMConvertorTests') IS NULL CREATE DATABASE ORMConvertorTests;"

      # The native Advisor library is not in this publication and does not need to be:
      # the Java suite never calls the Advisor (decision 078).
      - name: Publish the application
        working-directory: ORMConvertor
        run: >-
          dotnet publish ORMConvertorAPI/ORMConvertorAPI.csproj
          --configuration Release -o "${{ runner.temp }}/app"

      # Started in the background and not waited for here: the suite polls
      # /required-content itself, which is the one readiness mechanism that works both
      # here and in compose (decision 078).
      - name: Start the application
        working-directory: ORMConvertor
        env:
          ASPNETCORE_ENVIRONMENT: Production
          ASPNETCORE_URLS: http://localhost:5072
          ConnectionStrings__CatalogDatabase: Server=localhost,1433;Database=ORMConvertorTests;User ID=sa;Password=Testingorms123;TrustServerCertificate=True;
        run: >-
          nohup dotnet "${{ runner.temp }}/app/ORMConvertorAPI.dll"
          > "${{ runner.temp }}/app.log" 2>&1 &

      - name: Test (JUnit)
        env:
          # The suite has no skip: where it runs, a database and an instance were started
          # for it, and this job just did both. The credential is that of the throwaway
          # instance above.
          ORMCONVERTOR_TEST_JDBC_URL: jdbc:sqlserver://localhost:1433;databaseName=ORMConvertorTests;user=sa;password=Testingorms123;encrypt=true;trustServerCertificate=true
          ORMCONVERTOR_API_URL: http://localhost:5072/orm
        run: mvn -B test

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: java-test-results
          path: ORMConvertor/JavaTests/target/surefire-reports/
          if-no-files-found: warn

      # Where the suite fails because the instance did not come up, the reason is in its
      # log and nowhere else.
      - name: Upload the application log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: java-test-app-log
          path: ${{ runner.temp }}/app.log
          if-no-files-found: warn

  # Pinned versions (decisions 013 and 034) move deliberately, and a published advisory is
  # one of the two reasons to move them (decision 069). This job is what notices.
  dependencies:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ORMConvertor

    steps:
      - uses: actions/checkout@v5

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore ORMConvertor.sln

      - name: Check pinned packages against known advisories
        run: |
          # Without pipefail the pipeline would report the status of tee, which succeeds
          # whenever it can write the file: a failing `dotnet list` would pass this gate
          # having checked nothing.
          set -o pipefail
          dotnet list ORMConvertor.sln package --vulnerable --include-transitive | tee vulnerable.txt
          # The command reports advisories on stdout and still exits 0, so the exit code
          # has to be made here.
          if grep -q "has the following vulnerable packages" vulnerable.txt; then
            echo "::error::A referenced package has a known advisory - see the listing above."
            exit 1
          fi
