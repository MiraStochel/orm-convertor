# Container configuration of the environment (decision 039, requirement S5).
#
#   docker compose up --build                            the system: application + sample databases
#   docker compose --profile test build tests java_tests test_app test_app_ldbc test_app_cases test_db
#   docker compose --profile test run --rm tests         the .NET test suite, in a clean environment
#   docker compose --profile test run --rm java_tests    the Java test suite, likewise
#
# The test commands need nothing on the host but Docker. run does not rebuild - without the
# build line it runs the suite of whatever tree the images were built from - and then starts
# a SQL Server of its own, waits for it, creates the database and runs the whole suite. The
# Java suite additionally gets an instance of the application, because that is where it
# takes the generated artifacts from (decision 078). The SQL Server of the profile also holds
# LdbcSnb with the validation set of LDBC Interactive v1, the judge of the LDBC catalog
# (decision 117), at scale factor 0.1 and replayed to a prefix of its lines unless the
# environment says otherwise - ORMCONVERTOR_LDBC_VALIDATION_ROWS set to empty replays it whole.
#
# The measurement environment (decision 145): the databases run on processors 0-1 and every
# client - the application, both test suites and the instances they translate against - on
# 2-3, so that a measuring process and the server never share a core. The host gives the
# Docker VM at least four processors (on WSL2, .wslconfig); with fewer, Docker refuses the
# service rather than running it on a shared core. The server's memory and parallelism are
# set by the database image itself (database/init-db.sh).
#
# That is the default mode of both databases. The judge's mode (decisions 164 and 166) is the
# file judge.env beside this one - every processor of the VM for the judge's concurrent reads:
#
#   docker compose --env-file judge.env up -d mssql_db       into the judge's mode
#   docker compose up -d mssql_db                            back into the measurement mode
#
# The databases take DATABASE_CPUSET (empty for every processor), DATABASE_MAXDOP and
# DATABASE_MAX_SERVER_MEMORY_MB from it. While mssql_db runs in the judge's mode, every compose
# command that touches it carries the same --env-file: `up` of a service that depends on it,
# without the file, recreates the database in the measurement mode and cuts a running replay.
services:
  ormconvertor:
    build:
      context: .
      dockerfile: ORMConvertorAPI/Dockerfile
      target: runtime
    ports:
      - "5072:5072"
    cpuset: "2,3"
    networks:
      - default
      - edge
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      # The Advisor benchmarks against the sample database, and the catalog completion
      # phase reads its metadata. Without the second key the containerized instance would
      # translate with the completion phase switched off - the very thing F4 and F6 claim.
      # The catalog is WideWorldImporters unless ORMCONVERTOR_CATALOG_DATABASE names another
      # database of the same server - LdbcSnb, to translate over the LDBC tables (decision 110).
      - ConnectionStrings__AdvisorDatabase=Server=mssql_db,1433;Database=WideWorldImporters;User ID=sa;Password=Testingorms123;TrustServerCertificate=true;
      - ConnectionStrings__CatalogDatabase=Server=mssql_db,1433;Database=${ORMCONVERTOR_CATALOG_DATABASE:-WideWorldImporters};User ID=sa;Password=Testingorms123;TrustServerCertificate=true;
    restart: unless-stopped
    depends_on:
      mssql_db:
        condition: service_healthy

  # Three databases: WideWorldImporters; LdbcSnb with the LDBC SNB Interactive v1 data set
  # (decision 110), loaded on the first start - about a minute at scale factor 1, while the
  # server already answers; and Fiben with the FIBEN benchmark (decision 149), loaded the same
  # way with the judge of its catalog beside the data. LDBC_SCALE_FACTOR picks another
  # published scale factor, or none; FIBEN_DATASET another commit of IBM/fiben-benchmark, or none.
  mssql_db:
    build:
      context: .
      dockerfile: database.Dockerfile
      args:
        LDBC_SCALE_FACTOR: ${LDBC_SCALE_FACTOR:-1}
        FIBEN_DATASET: ${FIBEN_DATASET:-96eaffc60cc824b8f545cd29adffc2a170e08d04}
    ports:
      - "1444:1433"
    cpuset: "${DATABASE_CPUSET-0,1}"
    networks:
      - default
      - edge
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=Testingorms123
      - MSSQL_PID=Developer
      - DATABASE_MAXDOP=${DATABASE_MAXDOP-}
      - DATABASE_MAX_SERVER_MEMORY_MB=${DATABASE_MAX_SERVER_MEMORY_MB-}
    restart: unless-stopped
    volumes:
      - mssql_data:/var/opt/mssql

  # Profile "test" - the containerized reproduction of the test suite. Nothing below
  # starts with a plain `docker compose up`. The test database is deliberately not the
  # WideWorldImporters one: the test schema is the expected answer F4 measures against,
  # and the tests create it themselves (decision 016). The server is the image of mssql_db,
  # because the judge of the LDBC catalog needs LdbcSnb with its validation set (decision
  # 117) - at scale factor 0.1 here, loaded in seconds; LDBC_TEST_SCALE_FACTOR picks another
  # one LDBC publishes a validation set for (0.1 to 10). The FIBEN benchmark stays out: its
  # catalog runs on demand against mssql_db, never as part of a build (decision 149).
  test_db:
    profiles: ["test"]
    build:
      context: .
      dockerfile: database.Dockerfile
      args:
        LDBC_SCALE_FACTOR: ${LDBC_TEST_SCALE_FACTOR:-0.1}
        FIBEN_DATASET: none
    cpuset: "${DATABASE_CPUSET-0,1}"
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=Testingorms123
      - MSSQL_PID=Developer
      - DATABASE_MAXDOP=${DATABASE_MAXDOP-}
      - DATABASE_MAX_SERVER_MEMORY_MB=${DATABASE_MAX_SERVER_MEMORY_MB-}
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1'"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 15s

  # The fixture creates a schema, not a database, so the database is the configuration's
  # job - the test database and, beside it, the case-study database in which both suites
  # create the schemas of the excerpted projects (decision 176). Ordering by the health check
  # is also what keeps the suite from skipping merely because the server was still starting.
  # The server answers before LdbcSnb is loaded, so this also waits for the extended property
  # the loader writes last, ldbc.validation - and gives up after half an hour, which is a
  # failed load and not a slow one.
  test_db_init:
    profiles: ["test"]
    image: mcr.microsoft.com/mssql/server:2022-CU27-GDR1-ubuntu-22.04@sha256:cf8f0ab2ebe61feec2eed2629061a07d247f791c2a8ddda74a4ac9f06a291718
    depends_on:
      test_db:
        condition: service_healthy
    entrypoint:
      - /bin/bash
      - -c
      - |
        set -e
        sqlcmd="/opt/mssql-tools18/bin/sqlcmd -S test_db,1433 -U sa -P Testingorms123 -C -b"
        $$sqlcmd -Q "IF DB_ID('ORMConvertorTests') IS NULL CREATE DATABASE ORMConvertorTests;"
        $$sqlcmd -Q "IF DB_ID('ORMConvertorCaseStudies') IS NULL CREATE DATABASE ORMConvertorCaseStudies;"
        for attempt in $$(seq 1 360); do
          loaded=$$($$sqlcmd -h -1 -W -Q "SET NOCOUNT ON; IF DB_ID('LdbcSnb') IS NOT NULL EXEC (N'SELECT CAST(value AS NVARCHAR(200)) FROM LdbcSnb.sys.extended_properties WHERE class = 0 AND name = N''ldbc.validation''');")
          if [ -n "$$loaded" ]; then echo "LdbcSnb holds $$loaded."; exit 0; fi
          sleep 5
        done
        echo "LdbcSnb has no validation set after 30 minutes; see the log of test_db."
        exit 1

  tests:
    profiles: ["test"]
    build:
      context: .
      dockerfile: ORMConvertorAPI/Dockerfile
      target: tests
    cpuset: "2,3"
    # The suites run code the tool made and, on demand, code it did not (decision 172); the
    # memory of the VM is the one thing of the host such code could take. One suite at a time.
    mem_limit: 6g
    environment:
      - ConnectionStrings__TestDatabase=Server=test_db,1433;Database=ORMConvertorTests;User ID=sa;Password=Testingorms123;TrustServerCertificate=true;
      # Here the configuration promises a database, so its absence is a failure rather
      # than a skip - a green run in which everything skipped would prove nothing.
      - ORMCONVERTOR_REQUIRE_TEST_DATABASE=1
      # The judge of the LDBC catalog (decision 117), promised the same way. The whole set
      # takes hours even at scale factor 0.1, so the profile replays a prefix of it - a
      # smaller judge of its own, a check and not the verdict.
      - ConnectionStrings__LdbcDatabase=Server=test_db,1433;Database=LdbcSnb;User ID=sa;Password=Testingorms123;TrustServerCertificate=true;
      - ORMCONVERTOR_REQUIRE_LDBC_DATABASE=1
      - ORMCONVERTOR_LDBC_VALIDATION_ROWS=${ORMCONVERTOR_LDBC_VALIDATION_ROWS-1000}
    depends_on:
      test_db_init:
        condition: service_completed_successfully

  # The instance the Java suite translates against (decision 078). The same runtime image
  # the ormconvertor service runs, in the same environment a deployment assumes, with the
  # catalog key aimed at the test database - so the completion phase is available to it
  # exactly as it is to a deployed instance. The .NET suite needs nothing of this: it
  # verifies in its own process and starts its own host for the contract tests.
  test_app:
    profiles: ["test"]
    build:
      context: .
      dockerfile: ORMConvertorAPI/Dockerfile
      target: runtime
    cpuset: "2,3"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__CatalogDatabase=Server=test_db,1433;Database=ORMConvertorTests;User ID=sa;Password=Testingorms123;TrustServerCertificate=true;
    # The service name is the one the sibling services use, with an underscore; the alias
    # exists because the client is a JVM. An underscore is not a legal character in a
    # host name, so java.net.URI parses "http://test_app:5072/orm" as having no host and
    # the JDK's HttpClient refuses it outright ("unsupported URI"). The database services
    # are reached by a JDBC driver, which does not care, so only this one needs it.
    networks:
      default:
        aliases:
          - testapp
    depends_on:
      test_db_init:
        condition: service_completed_successfully

  # The second instance the Java suite translates against: the same image with LdbcSnb as the
  # catalog, for the judge of the LDBC catalog (decision 117) - an artifact completed over the
  # empty schema of the fixture would not find the tables of LdbcSnb in dbo. The alias exists
  # for the reason test_app's does.
  test_app_ldbc:
    profiles: ["test"]
    build:
      context: .
      dockerfile: ORMConvertorAPI/Dockerfile
      target: runtime
    cpuset: "2,3"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__CatalogDatabase=Server=test_db,1433;Database=LdbcSnb;User ID=sa;Password=Testingorms123;TrustServerCertificate=true;
    networks:
      default:
        aliases:
          - testappldbc
    depends_on:
      test_db_init:
        condition: service_completed_successfully

  # The third instance the Java suite translates against: the same image with the case-study
  # database as the catalog (decision 176), for the case studies of the experiment run - the
  # excerpts of real projects, whose tables the suite creates there, empty, so that the keys a
  # Dapper or MyBatis source cannot state come from the project's own schema. The alias exists
  # for the reason test_app's does.
  test_app_cases:
    profiles: ["test"]
    build:
      context: .
      dockerfile: ORMConvertorAPI/Dockerfile
      target: runtime
    cpuset: "2,3"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__CatalogDatabase=Server=test_db,1433;Database=ORMConvertorCaseStudies;User ID=sa;Password=Testingorms123;TrustServerCertificate=true;
    networks:
      default:
        aliases:
          - testappcases
    depends_on:
      test_db_init:
        condition: service_completed_successfully

  # The Java suite (decisions 076 and 078): the java-tests stage of the same Dockerfile,
  # against the same SQL Server, in a schema of its own so that both suites may run at
  # once, and against the instance above for the generated artifacts. The JDBC URL carries
  # user and password, as JDBC does; the credential is the same disposable one. There is no
  # "require" variable here - the suite runs only where a database and an instance were
  # started for it, so a missing one always fails. The suite waits for the instance itself:
  # the aspnet image carries no curl for a health check, so compose can only order the
  # start, not the readiness.
  java_tests:
    profiles: ["test"]
    build:
      context: .
      dockerfile: ORMConvertorAPI/Dockerfile
      target: java-tests
    cpuset: "2,3"
    mem_limit: 6g
    environment:
      - ORMCONVERTOR_TEST_JDBC_URL=jdbc:sqlserver://test_db:1433;databaseName=ORMConvertorTests;user=sa;password=Testingorms123;encrypt=true;trustServerCertificate=true
      - ORMCONVERTOR_API_URL=http://testapp:5072/orm
      # The judge of the LDBC catalog (decision 117), as for the .NET suite.
      - ORMCONVERTOR_TEST_LDBC_JDBC_URL=jdbc:sqlserver://test_db:1433;databaseName=LdbcSnb;user=sa;password=Testingorms123;encrypt=true;trustServerCertificate=true
      - ORMCONVERTOR_LDBC_API_URL=http://testappldbc:5072/orm
      - ORMCONVERTOR_REQUIRE_LDBC_DATABASE=1
      - ORMCONVERTOR_LDBC_VALIDATION_ROWS=${ORMCONVERTOR_LDBC_VALIDATION_ROWS-1000}
      # The case studies of the experiment run (decision 176): the instance over the case-study
      # database; the database itself is the test database's server with that name, so the
      # suite derives its JDBC URL from ORMCONVERTOR_TEST_JDBC_URL.
      - ORMCONVERTOR_CASESTUDY_API_URL=http://testappcases:5072/orm
    depends_on:
      test_db_init:
        condition: service_completed_successfully
      test_app:
        condition: service_started
      test_app_ldbc:
        condition: service_started
      test_app_cases:
        condition: service_started

volumes:
  mssql_data:

# The network of the project reaches nothing outside it (decision 172): the suites run code
# the tool made and, on demand, code it did not, and nothing here needs a network beyond the
# services - the images carry their packages and the data sets are loaded while they are
# built. The two services that publish a port sit on the second network as well; that is
# the one through which the host reaches them.
networks:
  default:
    internal: true
  edge: {}